services:

  mysql:
    image: patracamiguel/av-db:6.0
    container_name: av-db

    ports:
      - "3308:3306"

    restart: always

  backend:
    build: ./backend/proyecto
    container_name: av-backend

    environment:
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}

    ports:
      - "8083:8083"

    depends_on:
      - mysql

    restart: always
